services:
  db:
    image: mysql:8.4
    container_name: bluesio-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: bluesio
      MYSQL_USER: bluesio
      MYSQL_PASSWORD: bluesiopassword
    # Host port 3307 so it doesn't clash with a MySQL already on 3306
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db_data:
